name: 🧪 CI

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: Mutation testing
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: pcov
          extensions: pdo_sqlite, redis
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
      - name: Run Infection
        run: composer quality:mutation

  quality:
    runs-on: ubuntu-latest
    name: Quality checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: redis
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
      - name: Run PHPStan and PHP-CS-Fixer
        run: composer quality

  tests:
    runs-on: ubuntu-latest
    name: ⚙️ Docker integration suite (PHP 8.5)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
