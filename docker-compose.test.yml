name: query-builder-test

services:
  php-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /workspace
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_ROOT_VERSION: dev-main
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: "5432"
      PGVECTOR_DATABASE: query_builder_test
      PGVECTOR_USERNAME: query_builder
      PGVECTOR_PASSWORD: query-builder-test
      PGVECTOR_INTEGRATION: "1"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DOCKER_MYSQL_HOST: mysql
      DOCKER_MYSQL_PORT: "3306"
      DOCKER_MYSQL_DATABASE: query_builder_test
      DOCKER_MYSQL_USERNAME: query_builder
      DOCKER_MYSQL_PASSWORD: query-builder-test
      DOCKER_MYSQL_ROOT_PASSWORD: query-builder-test-root
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    environment:
      MYSQL_DATABASE: query_builder_test
      MYSQL_USER: query_builder
      MYSQL_PASSWORD: query-builder-test
      MYSQL_ROOT_PASSWORD: query-builder-test-root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  pgvector:
    image: pgvector/pgvector:0.8.5-pg17-bookworm@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_DB: query_builder_test
      POSTGRES_USER: query_builder
      POSTGRES_PASSWORD: query-builder-test
    volumes:
      - pgvector_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mysql_test_data:
  pgvector_test_data:
