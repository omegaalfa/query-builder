name: qb-ecosystem-bench
services:
  runner:
    build:
      context: ../..
      dockerfile: Dockerfile.test
    working_dir: /bench
    environment:
      XDEBUG_MODE: off
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ../..:/project:ro
      - .:/bench
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
  mysql:
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    environment:
      MYSQL_DATABASE: benchmark
      MYSQL_USER: benchmark
      MYSQL_PASSWORD: benchmark
      MYSQL_ROOT_PASSWORD: benchmark-root
    tmpfs: /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -uroot -pbenchmark-root --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 5s
      retries: 60